spring.application.name=kalymova-zhansaya-student-api
server.port=8080

# Values come from environment variables (docker-compose.yml / .env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.student=Zhansaya Kalymova
app.version=1.1.0
